name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # Todos os dias às 10:05 UTC
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_DESC: "Fedora RYnux - SO Imutável e Antifrágil"
  IMAGE_KEYWORDS: "bootc, fedora, rynux"
  IMAGE_NAME: "${{ github.event.repository.name }}"  # Puxará automaticamente 'Fedora_RYnux'
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Preparar ambiente
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar AppArmor & User Namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Liberar Espaço em Disco (Maximize Space)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Metadata da Imagem
        uses: docker/metadata-action@v5
        id: metadata
        with:
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value={{date 'YYYYMMDD'}}
          sep-tags: " "

      - name: Build da imagem inicial (Raw)
        run: |
          sudo podman build \
            --skip-unused-stages=false \
            --security-opt label=disable \
            -t "localhost/bootc-raw:latest" \
            -f Containerfile \
            .

      - name: Rechunk via bootc-base-imagectl
        run: |
          PRIMARY_IMAGE="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            quay.io/fedora/fedora-bootc:latest \
            /usr/libexec/bootc-base-imagectl rechunk \
            localhost/bootc-raw:latest \
            "${PRIMARY_IMAGE}"

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login \
            -u "${{ github.actor }}" --password-stdin "${{ env.IMAGE_REGISTRY }}"

      - name: Push e Tag da Imagem Otimizada
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_BASE="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          PRIMARY_IMAGE="${IMAGE_BASE}:${{ env.DEFAULT_TAG }}"

          # Push da tag principal rechunked (latest)
          sudo podman push "${PRIMARY_IMAGE}"

          # Tag e Push para as tags secundárias (ex: data YYYYMMDD)
          for TAG in ${{ steps.metadata.outputs.tags }}; do
            if [ "$TAG" != "${{ env.DEFAULT_TAG }}" ]; then
              echo "→ Aplicando e enviando tag: ${TAG}"
              sudo podman tag "${PRIMARY_IMAGE}" "${IMAGE_BASE}:${TAG}"
              sudo podman push "${IMAGE_BASE}:${TAG}"
            fi
          done

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'

      - name: Assinar imagem container
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY $IMAGE_FULL:$tag
          done
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

      - name: Preparar Release Notes
        if: github.event_name != 'pull_request'
        run: |
          RELEASE_TAG=$(date -u +%Y-%m-%d)
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          
          # Cria o arquivo Markdown para o corpo da Release
          echo "### 🚀 Nova Build do Fedora RYnux" > release_notes.md
          echo "Uma nova imagem do sistema operacional foi gerada com sucesso." >> release_notes.md
          echo "" >> release_notes.md
          echo "**Para aplicar a atualização no seu sistema, execute:**" >> release_notes.md
          echo "\`\`\`bash" >> release_notes.md
          echo "sudo bootc upgrade" >> release_notes.md
          echo "\`\`\`" >> release_notes.md

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: build-${{ env.RELEASE_TAG }}.${{ github.run_number }}
          name: "Fedora RYnux - Build ${{ env.RELEASE_TAG }} (#${{ github.run_number }})"
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: true