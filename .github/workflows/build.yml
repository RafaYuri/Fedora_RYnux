name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # Todos os dias às 10:05 UTC
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_DESC: "Fedora RYnux - SO Imutável e Antifrágil"
  IMAGE_KEYWORDS: "bootc, fedora, rynux"
  IMAGE_NAME: "${{ github.event.repository.name }}"  # Puxará automaticamente 'Fedora_RYnux'
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Preparar ambiente
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar AppArmor & User Namespaces para Buildah
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Liberar Espaço em Disco (Maximize Space)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Obter data atual
        id: date
        run: |
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      - name: Metadata da Imagem
        uses: docker/metadata-action@v6
        id: metadata
        with:
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value={{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            containers.bootc=1
          sep-tags: " "

      - name: Construir Imagem
        id: build_image
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: |
            ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: false
          extra-args: |
            --skip-unused-stages=false
            --security-opt=label=disable

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push para GHCR
        uses: redhat-actions/push-to-registry@v2
        if: github.event_name != 'pull_request'
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'

      - name: Assinar imagem container
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY $IMAGE_FULL:$tag
          done
        env:
          TAGS: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

      - name: Preparar Release Notes
        if: github.event_name != 'pull_request'
        run: |
          # Gera uma tag legível baseada na data atual, ex: 2026-07-28
          RELEASE_TAG=$(date -u +%Y-%m-%d)
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          
          # Cria um arquivo Markdown simples para o corpo da Release
          echo "### 🚀 Nova Build do Fedora RYnux" > release_notes.md
          echo "Uma nova imagem do sistema operacional foi gerada com sucesso." >> release_notes.md
          echo "" >> release_notes.md
          echo "**Para aplicar a atualização no seu sistema, execute:**" >> release_notes.md
          echo "\`\`\`bash" >> release_notes.md
          echo "sudo bootc upgrade" >> release_notes.md
          echo "\`\`\`" >> release_notes.md

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: build-${{ env.RELEASE_TAG }}
          name: "Fedora RYnux - Build ${{ env.RELEASE_TAG }}"
          body_path: release_notes.md
          token: ${{ secrets.GITHUB_TOKEN }}
