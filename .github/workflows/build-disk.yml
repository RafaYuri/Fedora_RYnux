name: Construir Imagens de Disco
on:
  workflow_dispatch: # Permite disparar a geração da ISO manualmente
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/iso.toml'
      - './.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} 
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"
  IB_IMAGE: "ghcr.io/osbuild/image-builder-cli:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Gerar Imagem ISO
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Preparar Variáveis de Ambiente
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Liberar Espaço em Disco
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Clonar Repositório
        uses: actions/checkout@v7

      - name: Desativar AppArmor
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo aa-teardown || true
          sudo systemctl stop apparmor || true

      - name: Baixar Imagem Base (bootc)
        run: |
          sudo podman pull ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}

      - name: Preparar Contêiner do Instalador (Anaconda WebUI)
        run: |
          cat << 'EOF' > Containerfile.installer
          FROM ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          RUN dnf install -y \
              anaconda \
              anaconda-webui \
              anaconda-install-img-deps \
              anaconda-dracut \
              anaconda-live \
              dracut-live \
              dracut-network \
              squashfs-tools \
              xorriso \
              isomd5sum \
              grub2-pc-modules \
              && dnf clean all
          RUN KVER=$(cd /usr/lib/modules && ls -1 | head -n 1) && \
              dracut --no-hostonly --kver "$KVER" --add "dmsquash-live dmsquash-live-ntfs pollcdrom qemu qemu-net" \
              --force "/usr/lib/modules/$KVER/initramfs.img"
          EOF
          sudo podman build -f Containerfile.installer -t localhost/rynux-installer:latest .

      - name: Construir ISO com osbuild/image-builder
        id: build
        run: |
          mkdir -p ./output
          sudo podman run --rm --privileged \
            -v "$(pwd)/output:/output" \
            -v "$(pwd)/disk_config:/config:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            --security-opt label=type:unconfined_t \
            ${{ env.IB_IMAGE }} \
            build bootc-installer \
            --bootc-ref localhost/rynux-installer:latest \
            --bootc-installer-payload-ref ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }} \
            --bootc-default-fs btrfs \
            --blueprint /config/iso.toml \
            --output-dir /output
          sudo chown -R ${{ env.USER_UID }}:${{ env.USER_GID }} ./output
          echo "output-directory=./output" >> "${GITHUB_OUTPUT}"

      - name: Enviar ISO para os Artefatos
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Fedora_RYnux-ISO
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 5