name: Construir ISO de Instalação (image-builder)
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'iso/**'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"
  FEDORA_VERSION: "44"
  IB_IMAGE: "ghcr.io/osbuild/image-builder-cli:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Gerar ISO com osbuild/image-builder
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Normalizar Variáveis de Ambiente
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "USER_UID=$(id -u)" >> ${GITHUB_ENV}
          echo "USER_GID=$(id -g)" >> ${GITHUB_ENV}

      - name: Liberar Espaço em Disco
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af || true
          df -h

      - name: Configurar AppArmor & User Namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo aa-teardown || true
          sudo systemctl stop apparmor || true

      - name: Clonar Repositório
        uses: actions/checkout@v7

      - name: Login no GHCR (Podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login \
            -u "${{ github.actor }}" --password-stdin ghcr.io

      - name: Baixar Imagem Payload do Fedora RYnux (bootc)
        run: |
          PAYLOAD_REF="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
          sudo podman pull "${PAYLOAD_REF}"

      - name: Construir Container do Ambiente de Boot da ISO (Anaconda WebUI)
        run: |
          PAYLOAD_REF="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
          sudo podman build \
            --security-opt label=disable \
            --build-arg FEDORA_VERSION="${{ env.FEDORA_VERSION }}" \
            --build-arg PAYLOAD_IMAGE="${PAYLOAD_REF}" \
            -f iso/Containerfile.iso \
            -t localhost/rynux-iso-env:latest .

      - name: Inspecionar Container da ISO com image-builder
        run: |
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ${{ env.IB_IMAGE }} \
            bootc inspect --ref localhost/rynux-iso-env:latest

      - name: Gerar ISO de Instalação (bootc-generic-iso)
        id: build
        run: |
          PAYLOAD_REF="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
          ISO_FILENAME="${{ env.IMAGE_NAME }}-${{ env.DEFAULT_TAG }}.iso"
          mkdir -p ./output

          sudo podman run --rm --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ${{ env.IB_IMAGE }} \
            build \
            --bootc-ref localhost/rynux-iso-env:latest \
            --bootc-installer-payload-ref "${PAYLOAD_REF}" \
            --bootc-default-fs btrfs \
            --output-dir /output \
            --output-name "${ISO_FILENAME}" \
            bootc-generic-iso

          sudo chown -R ${{ env.USER_UID }}:${{ env.USER_GID }} ./output
          if [ ! -f "./output/${ISO_FILENAME}" ]; then
            FOUND_ISO=$(find ./output -maxdepth 2 -type f -name "*.iso" | head -n 1)
            mv -v "${FOUND_ISO}" "./output/${ISO_FILENAME}"
          fi
          cd ./output
          sha256sum "${ISO_FILENAME}" | tee SHA256SUMS
          ls -lh

      - name: Enviar ISO para os Artefatos
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Fedora_RYnux-Installer-ISO
          path: |
            ./output/${{ env.IMAGE_NAME }}-${{ env.DEFAULT_TAG }}.iso
            ./output/SHA256SUMS
          if-no-files-found: error
          retention-days: 5