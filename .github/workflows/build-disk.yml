name: Construir Imagens de Disco
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/iso.toml'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} 
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"
  IB_IMAGE: "ghcr.io/osbuild/image-builder-cli:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Gerar Imagem ISO
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Preparar Variáveis de Ambiente
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Liberar Espaço em Disco
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af || true
          df -h

      - name: Clonar Repositório
        uses: actions/checkout@v7

      - name: Configurar AppArmor & User Namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo aa-teardown || true
          sudo systemctl stop apparmor || true

      - name: Login no GHCR (Podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login \
            -u "${{ github.actor }}" --password-stdin ghcr.io

      - name: Baixar Imagem Base (bootc)
        run: |
          sudo podman pull ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}

      - name: Sincronizar Registro no Blueprint
        run: |
          # Atualiza tanto a fonte do payload quanto o kickstart
          sed -i "s|ghcr.io/rafayuri/fedora_rynux:latest|${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}|g" disk_config/iso.toml
          cat disk_config/iso.toml

      - name: Construir ISO com image-builder
        id: build
        run: |
          mkdir -p ./output
          sudo podman run --rm --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output:/output" \
            -v "$(pwd)/disk_config:/config:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ${{ env.IB_IMAGE }} \
            build \
            --blueprint /config/iso.toml \
            --output-dir /output \
            bootc-installer

          sudo chown -R ${{ env.USER_UID }}:${{ env.USER_GID }} ./output
          echo "output-directory=./output" >> "${GITHUB_OUTPUT}"

      - name: Verificar Arquivos Gerados e Checksums
        run: |
          ls -lh ./output
          find ./output -type f -name "*.iso" -exec sha256sum {} + | tee ./output/SHA256SUMS

      - name: Enviar ISO para os Artefatos
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Fedora_RYnux-ISO
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 5