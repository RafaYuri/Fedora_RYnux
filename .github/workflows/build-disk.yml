name: Construir ISO de Instalação (UBlue Style)
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"
  # Versão base do Fedora do seu container (ex: 41, 42, 43 ou 44)
  FEDORA_VERSION: "latest"
  # Variante base: Kinoite (KDE Plasma)
  VARIANT: "Kinoite"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Gerar ISO com build-container-installer
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Normalizar Variáveis de Ambiente
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Liberar Espaço em Disco
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af || true
          df -h

      - name: Clonar Repositório
        uses: actions/checkout@v7

      - name: Gerar ISO de Instalação do Fedora RYnux
        id: build
        uses: jasonn3/build-container-installer@main
        with:
          arch: x86_64
          version: ${{ env.FEDORA_VERSION }}
          variant: ${{ env.VARIANT }}
          image_repo: ${{ env.IMAGE_REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}
          image_tag: ${{ env.DEFAULT_TAG }}
          iso_name: "${{ env.IMAGE_NAME }}-${{ env.DEFAULT_TAG }}.iso"
          # Permite instalar imagens de repositórios públicos sem necessidade de cosign local
          enable_cache_dnf: "false"

      - name: Verificar ISO e Gerar Checksums
        run: |
          ls -lh "${{ steps.build.outputs.iso_path }}"
          cd "${{ steps.build.outputs.iso_path }}"
          sha256sum "${{ steps.build.outputs.iso_name }}" | tee SHA256SUMS

      - name: Enviar ISO para os Artefatos
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Fedora_RYnux-Installer-ISO
          path: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
            ${{ steps.build.outputs.iso_path }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 5