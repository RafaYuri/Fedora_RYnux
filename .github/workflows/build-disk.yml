name: Construir Imagens de Disco
on:
  workflow_dispatch: # Permite disparar a geração da ISO manualmente
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/iso.toml'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} 
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"
  IB_IMAGE: "ghcr.io/osbuild/image-builder-cli:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Gerar Imagem ISO
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Preparar Variáveis de Ambiente
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Liberar Espaço em Disco
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af || true
          df -h

      - name: Clonar Repositório
        uses: actions/checkout@v7

      - name: Configurar AppArmor & User Namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo aa-teardown || true
          sudo systemctl stop apparmor || true

      - name: Login no GHCR (Podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login \
            -u "${{ github.actor }}" --password-stdin ghcr.io

      - name: Baixar Imagem Base (bootc)
        run: |
          sudo podman pull ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}

      - name: Sincronizar Registro no Blueprint
        run: |
          # Garante que o kickstart do instalador aponte para o repositório correto (útil em forks)
          sed -i "s|ghcr.io/rafayuri/fedora_rynux:latest|${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}|g" disk_config/iso.toml

      - name: Preparar Estrutura EFI para o image-builder
        run: |
          cat << 'EOF' > Containerfile.iso
          FROM ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}

          # Garante ferramentas e binários de bootloader para UEFI e BIOS
          RUN dnf install -y --setopt=tsflags=nodocs shim-x64 grub2-efi-x64 grub2-efi-x64-cdboot grub2-pc-modules && dnf clean all || true

          # Popula /boot/efi/EFI/fedora conforme o contrato esperado pelo osbuild (org.osbuild.grub2.iso)
          RUN set -eux; \
              mkdir -p /boot/efi/EFI/fedora; \
              if [ -d /usr/lib/bootupd/updates/EFI/fedora ]; then \
                  cp -a /usr/lib/bootupd/updates/EFI/fedora/* /boot/efi/EFI/fedora/ ; \
              elif [ -d /usr/lib/bootupd/updates/EFI ]; then \
                  cp -a /usr/lib/bootupd/updates/EFI/* /boot/efi/EFI/ ; \
              fi; \
              if [ -d /usr/lib/efi/shim ]; then \
                  find /usr/lib/efi/shim -name "shimx64.efi" -exec cp {} /boot/efi/EFI/fedora/ \; 2>/dev/null || true; \
              fi; \
              for efi in shimx64.efi mmx64.efi gcdx64.efi grubx64.efi; do \
                  if [ ! -f "/boot/efi/EFI/fedora/${efi}" ]; then \
                      src="$(find /usr -type f -name "${efi}" 2>/dev/null | head -n 1 || true)"; \
                      if [ -n "${src}" ]; then \
                          cp "${src}" "/boot/efi/EFI/fedora/${efi}"; \
                      fi; \
                  fi; \
              done; \
              if [ ! -f /boot/efi/EFI/fedora/gcdx64.efi ] && [ -f /boot/efi/EFI/fedora/grubx64.efi ]; then \
                  cp /boot/efi/EFI/fedora/grubx64.efi /boot/efi/EFI/fedora/gcdx64.efi; \
              fi; \
              test -f /boot/efi/EFI/fedora/shimx64.efi; \
              ls -la /boot/efi/EFI/fedora/
          EOF
          sudo podman build -f Containerfile.iso -t localhost/rynux-bootc-iso:latest .

      - name: Construir ISO com image-builder
        id: build
        run: |
          mkdir -p ./output
          sudo podman run --rm --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output:/output" \
            -v "$(pwd)/disk_config:/config:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ${{ env.IB_IMAGE }} \
            build \
            --blueprint /config/iso.toml \
            --output-dir /output \
            --bootc-ref localhost/rynux-bootc-iso:latest \
            --bootc-default-fs btrfs \
            bootc-generic-iso

          sudo chown -R ${{ env.USER_UID }}:${{ env.USER_GID }} ./output
          echo "output-directory=./output" >> "${GITHUB_OUTPUT}"

      - name: Verificar Arquivos Gerados e Checksums
        run: |
          ls -lh ./output
          find ./output -type f -name "*.iso" -exec sha256sum {} + | tee ./output/SHA256SUMS

      - name: Enviar ISO para os Artefatos
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Fedora_RYnux-ISO
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 5