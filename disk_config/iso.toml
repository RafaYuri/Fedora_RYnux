# disk_config/iso.toml

[[containers]]
source = "ghcr.io/rafayuri/fedora_rynux:latest"

[customizations.installer.kickstart]
contents = """
# Define modo gráfico (WebUI/Anaconda padrão)
graphical

%post --erroronfail
# Aponta o bootc para receber atualizações futuras do seu registry no GitHub
bootc switch --mutate-in-place --transport registry ghcr.io/rafayuri/fedora_rynux:latest
%end
"""

[customizations.installer.modules]
disable = [
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Subscription"
]